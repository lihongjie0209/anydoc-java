name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (linux-x86_64, glibc 2.17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: firecrawl/anydoc
          ref: v0.1.6
          path: .anydoc

      - uses: dtolnay/rust-toolchain@stable

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build native (glibc 2.17)
        run: sh scripts/build-native.sh linux-x86_64

      - name: Test
        run: mvn -B -DskipNative test -Danydoc.fixtures=${{ github.workspace }}/.anydoc/tests/fixtures

      - name: Check glibc floor
        run: |
          so=native/dist/linux-x86_64/libanydoc_java.so
          max=$(objdump -T "$so" | sed -n 's/.*GLIBC_\([0-9.]*\).*/\1/p' | sort -t. -k1,1n -k2,2n | tail -n 1)
          echo "GLIBC max $max"
          test "$max" = "2.17"

  native:
    name: Native ${{ matrix.classifier }}
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - classifier: linux-x86_64
            os: ubuntu-latest
            zig: true
          - classifier: linux-aarch64
            os: ubuntu-latest
            zig: true
          - classifier: linux-x86_64-musl
            os: ubuntu-latest
            zig: true
          - classifier: linux-aarch64-musl
            os: ubuntu-latest
            zig: true
          - classifier: macos-aarch64
            os: macos-latest
          - classifier: macos-x86_64
            os: macos-latest
          - classifier: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: mlugg/setup-zig@v2
        if: matrix.zig
        with:
          version: 0.14.1

      - uses: taiki-e/install-action@v2
        if: matrix.zig
        with:
          tool: cargo-zigbuild

      - name: Build native
        shell: bash
        run: sh scripts/build-native.sh ${{ matrix.classifier }}

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.classifier }}
          path: native/dist/${{ matrix.classifier }}
          if-no-files-found: error

  package:
    name: Package JARs
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native/dist

      - name: Layout downloaded natives
        run: |
          set -eu
          cd native/dist
          for d in native-*; do
            [ -d "$d" ] || continue
            mv "$d" "${d#native-}"
          done
          find . -type f -ls

      - name: Package fat JAR
        run: mvn -B -DskipNative -DskipTests package

      - name: Package per-platform JARs
        run: sh scripts/package-jars.sh

      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            target/anydoc-*.jar
            target/maven-coordinates.properties
          if-no-files-found: error

      - name: Publish to GitHub Packages
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          version=$(sed -n 's/^version=//p' target/maven-coordinates.properties)
          # GitHub Packages rejects re-uploading the same POM/version (409).
          if ! mvn -B -DskipNative -DskipTests deploy --settings .github/maven-settings.xml; then
            echo "main deploy failed; continuing with classifiers if the version is already published"
          fi
          for jar in target/anydoc-${version}-*.jar; do
            [ -f "$jar" ] || continue
            classifier=${jar#target/anydoc-${version}-}
            classifier=${classifier%.jar}
            mvn -B org.apache.maven.plugins:maven-deploy-plugin:3.1.3:deploy-file \
              --settings .github/maven-settings.xml \
              -DgroupId=io.github.lihongjie0209 \
              -DartifactId=anydoc \
              -Dversion="$version" \
              -Dpackaging=jar \
              -Dclassifier="$classifier" \
              -Dfile="$jar" \
              -DgeneratePom=false \
              -DrepositoryId=github \
              -Durl=https://maven.pkg.github.com/lihongjie0209/anydoc-java
          done

      - name: Attach JARs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" target/anydoc-*.jar --clobber
